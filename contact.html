<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | Портфолио</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body data-page="contact">
    <div class="dots" aria-hidden="true"></div>

    <header class="site-header">
        <nav aria-label="Основная навигация">
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">Обо мне</a></li>
                <li><a href="projects.html">Мои проекты</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Переключить тему">Тёмная тема</button>
    </header>

    <main class="page-main">
        <section class="content-section block">
            <h1>Контакты</h1>
            <form class="contact-form" action="#" method="post">
                <label for="name">Имя</label>
                <input id="name" name="name" type="text" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>

                <label for="message">Сообщение</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Отправить</button>
            </form>
        </section>

        <section class="content-section block">
            <h2>Контактная информация</h2>
            <p><strong>Email:</strong> schneider.dev0@gmail.com</p>
            <ul class="social-links">
                <li><a href="https://t.me/schneider_dev" target="_blank" rel="noopener noreferrer">Telegram</a></li>
                <li><a href="https://github.com/schneiderdev0" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            </ul>
        </section>
    </main>

    <footer class="site-footer">
        <b id="current-year">2026</b>
        <b>schneider.dev</b>
    </footer>
</body>

</html>
